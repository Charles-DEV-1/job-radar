# Stage 2 rules. No salary, compensation, paid, or unpaid checks.
# Student profile: internships and junior roles; title rules only.
seniority:
  exclude: [manager, head of, director, VP, vice president, principal, staff, chief, CTO]
  maybe: [senior, lead]
roles:
  # Explicit engineering titles take priority over product areas such as "Asset Sales".
  engineering_titles: [backend engineer, backend developer, back-end engineer, software engineer, software developer, frontend engineer, full stack engineer, platform engineer, python developer, java developer, go engineer, node.js engineer]
  include:
    - backend
    - back-end
    - back end
    - software engineer
    - software engineering
    - software developer
    - developer
    - platform engineer
    - platform
    - api
    - python
    - java
    - golang
    - go
    - node
    - nodejs
    - node.js
    - distributed systems
    - infrastructure engineer
    - infrastructure
    - full stack
    - full-stack
    - frontend
    - front-end
    - mobile engineer
  maybe: [devops, sre, site reliability, data engineer, data engineering]
  training: [intern, internship, graduate, trainee]
  exclude:
    - sales
    - marketing
    - human resources
    - hr
    - recruiter
    - talent acquisition
    - finance
    - financial analyst
    - accountant
    - accounting
    - customer support
    - customer service
    - customer care
    - business relationship
    - relationship manager
    - business development
    - business intelligence analyst
    - sales executive
    - telesales
    - legal
    - compliance officer
    - office administrator
    - administrative business partner
    - operations manager
    - driver
    - medical
    - nurse
    - graphic designer
  # Safer description fallback: avoid ordinary uses of words such as "go" or "node".
  description_include:
    - software engineering
    - backend engineering
    - backend development
    - back-end development
    - api development
    - distributed systems
    - python developer
    - java developer
    - golang
    - node.js
    - software development
