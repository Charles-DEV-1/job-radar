name: Job Radar retention cleanup

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

concurrency:
  group: job-radar-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install pipeline dependencies
        run: python -m pip install -e ./pipeline
      - name: Run retention cleanup
        run: python -m pipeline.cleanup
